name: Build Android APK - MS ADVANCED MOBICARE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Apache Cordova Globally
        run: npm install -g cordova

      - name: Prepare Cordova Project Structure
        run: |
          rm -rf cordova_app
          mkdir -p www
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != "config.xml" ] && [ "$item" != "res" ] && [ "$item" != "icon.png" ] && [ "$item" != "splash.png" ] && [ "$item" != ".github" ]; then
              mv "$item" www/ 2>/dev/null || true
            fi
          done
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "icon.png" ] && [ -f "www/logo.png" ]; then
            cp www/logo.png icon.png
          fi
          if [ ! -f "splash.png" ] && [ -f "www/logo.png" ]; then
            cp www/logo.png splash.png
          fi
          mkdir -p res/drawable
          if [ ! -f "res/drawable/logo.png" ] && [ -f "www/logo.png" ]; then
            cp www/logo.png res/drawable/logo.png
          fi

      - name: Create Cordova App & Add Android Platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

          cordova create cordova_app com.faruk.msadvancedmobicare "MS ADVANCED MOBICARE"
          if [ -f "config.xml" ]; then
            cp config.xml cordova_app/config.xml
          fi
          if [ -d "res" ]; then
            cp -r res cordova_app/res
          fi
          if [ -f "icon.png" ]; then
            cp icon.png cordova_app/icon.png
          fi
          if [ -f "splash.png" ]; then
            cp splash.png cordova_app/splash.png
          fi
          rm -rf cordova_app/www/*
          cp -r www/* cordova_app/www/

          mkdir -p cordova_app/res/anim
          cat << 'EOF' > cordova_app/res/anim/drop_from_top_above_center.xml
<?xml version="1.0" encoding="utf-8"?>
<set xmlns:android="http://schemas.android.com/apk/res/android"
    android:interpolator="@android:anim/decelerate_interpolator">
    <translate
        android:fromYDelta="-100%p"
        android:toYDelta="-12%p"
        android:duration="600" />
    <alpha
        android:fromAlpha="0.0"
        android:toAlpha="1.0"
        android:duration="600" />
</set>
EOF

          cd cordova_app
          cordova platform add android@13.0.0 --no-telemetry

      - name: Build Debug Android APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

          cd cordova_app
          cordova build android --debug --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS-ADVANCED-MOBICARE-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
